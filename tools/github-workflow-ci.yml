name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  quality:
    name: Calidad y arquitectura
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: latam_social_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s
          --health-timeout=5s --health-retries=5
      # Percona 5.7 DE VERDAD, no una imitacion.
      #
      # Hasta ahora "el motor sin CHECK" se simulaba cargando el esquema
      # `-sin-check` en MySQL 8. Eso comprueba que los disparadores generados
      # imponen las mismas reglas, que no es poco, pero **no comprueba que
      # Percona 5.7 acepte el esquema**: son dos motores distintos y ya hemos
      # visto tres divergencias en esta fase. Produccion es 5.7; que 5.7 no
      # aparezca en ningun sitio de la cadena era un hueco.
      percona57:
        image: percona:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3307:3306']
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s
          --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s
          --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, redis, gd, zip, bcmath, soap
          coverage: none

      - name: Cachear dependencias
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate

      # --- Las cuatro puertas de docs/03 §1 y docs/08 -----------------------
      - name: Formato (Pint)
        run: vendor/bin/pint --test

      - name: Análisis estático (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Fronteras entre módulos (Deptrac)
        run: vendor/bin/deptrac analyse --fail-on-uncovered --report-uncovered

      # --- Integridad del modelo de datos (DEC-042, DEC-050) ---------------
      # El cliente de MySQL y sus credenciales no son los mismos que en local.
      # La imagen del runner no garantiza traer cliente de MySQL: el servicio
      # `mysql` es un contenedor aparte, y el cliente va en el runner. Sin esto
      # el flujo puede fallar por "mysql: command not found", que no dice nada
      # sobre el codigo.
      - name: Cliente de base de datos
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client

      - name: Cliente de base de datos para las herramientas
        run: echo "MYSQL_CMD=mysql -h127.0.0.1 -uroot -proot" >> $GITHUB_ENV

      - name: Nombres de indices y restricciones sin colisiones
        run: python3 tools/verificar-nombres-sql.py

      - name: Generar el esquema sin CHECK y sus triggers equivalentes
        run: python3 tools/generar-triggers.py

      # Las dos bases de referencia se montan con el mismo script que en local,
      # y el orden de carga lo calcula el script leyendo los REFERENCES. Antes
      # estaba escrito a mano aqui y a mano en la maquina de desarrollo: dos
      # listas que hay que acordarse de tocar a la vez, que es como se cuela un
      # esquema nuevo en un sitio y no en el otro.
      - name: Cargar los dos esquemas de referencia
        run: |
          bash tools/rehacer-referencia.sh latam_ref latam_57
          $MYSQL_CMD latam_ref < tools/pruebas/semilla.sql
          $MYSQL_CMD latam_57  < tools/pruebas/semilla.sql

      - name: Las migraciones declaran lo mismo que el esquema de referencia
        run: python3 tools/verificar-migraciones.py latam_ref

      - name: El generador de triggers acerto con las columnas
        run: python3 tools/verificar-triggers-generados.py latam_ref

      - name: Restricciones (motor con CHECK nativo)
        run: |
          bash tools/pruebas/2.12-contenido.sh latam_ref
          bash tools/pruebas/2.13-finanzas.sh  latam_ref
          bash tools/pruebas/3.5-activacion.sh latam_ref
          bash tools/pruebas/3.6-fiscal.sh     latam_ref
          bash tools/pruebas/3.7-redes.sh      latam_ref
          bash tools/pruebas/3.8-pagos.sh      latam_ref
          bash tools/pruebas/3.9-tarifas.sh    latam_ref

      # La mitad que importa: produccion es Percona 5.7 y NO aplica los CHECK.
      - name: Restricciones (motor sin CHECK, solo triggers generados)
        run: |
          bash tools/pruebas/2.12-contenido.sh latam_57
          bash tools/pruebas/2.13-finanzas.sh  latam_57
          bash tools/pruebas/3.5-activacion.sh latam_57
          bash tools/pruebas/3.6-fiscal.sh     latam_57
          bash tools/pruebas/3.7-redes.sh      latam_57
          bash tools/pruebas/3.8-pagos.sh      latam_57
          bash tools/pruebas/3.9-tarifas.sh    latam_57

      - name: Los dos motores imponen el mismo conjunto de reglas
        run: python3 tools/verificar-equivalencia.py latam_ref latam_57

      # --- Y ahora lo mismo, pero contra el motor que hay en produccion -----
      - name: Percona 5.7 acepta el esquema y sus disparadores
        run: |
          P57="mysql -h127.0.0.1 -P3307 --protocol=TCP -uroot -proot"
          # El script crea las dos bases. 5.7 acepta la sintaxis `CHECK` y la
          # IGNORA en silencio: por eso la que se prueba de verdad es la de
          # disparadores, que es lo que impone las reglas alli.
          MYSQL_CMD="$P57" bash tools/rehacer-referencia.sh latam_p57 latam_p57_triggers
          $P57 latam_p57_triggers < tools/pruebas/semilla.sql

      - name: Restricciones sobre Percona 5.7 (lo que vera produccion)
        run: |
          export MYSQL_CMD="mysql -h127.0.0.1 -P3307 --protocol=TCP -uroot -proot"
          bash tools/pruebas/2.12-contenido.sh latam_p57_triggers
          bash tools/pruebas/2.13-finanzas.sh  latam_p57_triggers
          bash tools/pruebas/3.5-activacion.sh latam_p57_triggers
          bash tools/pruebas/3.6-fiscal.sh     latam_p57_triggers
          bash tools/pruebas/3.7-redes.sh      latam_p57_triggers
          bash tools/pruebas/3.8-pagos.sh      latam_p57_triggers
          bash tools/pruebas/3.9-tarifas.sh    latam_p57_triggers
          bash tools/pruebas/3.10-periodos.sh  latam_p57_triggers

      # Los fixtures de PHPUnit ejecutados contra el esquema, ANTES de que
      # PHPUnit los use. Aqui el fallo dice «`ck_camp_confirmed` incumplida, el
      # fixture pone status='in_progress'»; en PHPUnit dice «14 failed» y hay
      # que ir a buscarlo. Tres iteraciones se fueron en rojo por esto.
      # La regla de periodos vive en el esquema de referencia Y en la migracion.
      # Hoy salen de la misma clase; esto es lo que impide que manana no.
      - name: El esquema y las migraciones dicen lo mismo sobre periodos
        run: python3 tools/verificar-periodos.py

      - name: Los fixtures de las pruebas no contradicen al esquema
        run: |
          export MYSQL_CMD="mysql -h127.0.0.1 -P3307 --protocol=TCP -uroot -proot"
          python3 tools/verificar-fixturas.py latam_p57_triggers \
            --cliente "mysql -h127.0.0.1 -P3307 --protocol=TCP -uroot -proot"

      - name: El SQL crudo de las migraciones lo acepta Percona 5.7
        run: |
          export MYSQL_CMD="mysql -h127.0.0.1 -P3307 --protocol=TCP -uroot -proot"
          python3 tools/verificar-ddl-crudo.py latam_p57

      # H-08: el grabador de `verificar-migraciones.py` SIMULA `DB::statement`,
      # asi que hasta ahora ninguna sentencia cruda se habia ejecutado nunca
      # fuera de la maquina de desarrollo. Un `ALTER TABLE ... MODIFY` sobre una
      # columna con foranea encima lo acepta MariaDB y lo rechaza MySQL 8 con el
      # error 1832. Esto lo ejecuta de verdad, aqui, contra MySQL 8.
      - name: El SQL crudo de las migraciones lo acepta MySQL 8
        run: python3 tools/verificar-ddl-crudo.py latam_ref

      - name: Migraciones
        run: php artisan migrate --force
        env:
          DB_DATABASE: latam_social_test
          DB_USERNAME: root
          DB_PASSWORD: root

      # Nada verificaba hasta ahora que el CSS compile. Un fallo en el build del
      # frontend no rompe ninguna prueba de PHP: se descubre en el navegador,
      # que es el peor sitio para descubrirlo.
      - name: Construir el frontend
        run: npm ci && npm run build

      - name: Pruebas
        run: php artisan test
        env:
          DB_DATABASE: latam_social_test
          DB_USERNAME: root
          DB_PASSWORD: root
