# =============================================================================
# LATAM Social — fronteras entre módulos
#
# Esto convierte el "monolito modular" de docs/03 §1 en una regla verificable.
# Si un módulo importa algo que no le corresponde, CI falla. Sin esto, la
# arquitectura es una intención; con esto, es un hecho comprobable.
#
# El grafo es ACÍCLICO a propósito (docs/00 §D.1):
#   - Shared y Core no dependen de nadie.
#   - Communication solo conoce Shared/Core/Identity: recibe datos por evento,
#     nunca importa entidades de negocio. Así un fallo de correo no arrastra nada.
#   - Intelligence y Gamification leen mucho y NADIE depende de ellos: si se caen,
#     la operación sigue.
#
#   composer deptrac
# =============================================================================
deptrac:
  paths:
    - ./app

  layers:
    - name: Shared
      collectors: [{ type: directory, value: app/Shared/.* }]
    - name: Identity
      collectors: [{ type: directory, value: app/Modules/Identity/.* }]
    - name: Core
      collectors: [{ type: directory, value: app/Modules/Core/.* }]
    - name: Creator
      collectors: [{ type: directory, value: app/Modules/Creator/.* }]
    - name: Crm
      collectors: [{ type: directory, value: app/Modules/Crm/.* }]
    - name: Client
      collectors: [{ type: directory, value: app/Modules/Client/.* }]
    - name: Campaign
      collectors: [{ type: directory, value: app/Modules/Campaign/.* }]
    - name: Matching
      collectors: [{ type: directory, value: app/Modules/Matching/.* }]
    - name: Content
      collectors: [{ type: directory, value: app/Modules/Content/.* }]
    - name: Measurement
      collectors: [{ type: directory, value: app/Modules/Measurement/.* }]
    # 9.9d -- Finance SIN el adaptador peruano.
    #
    # `must_not` lo saca de esta capa para poder darle a esa carpeta --y solo a
    # ella-- permiso para nombrar a Greenter. Sin el `must_not`, el adaptador
    # seria «Finance» y el permiso valdria para todo el modulo, que es
    # exactamente lo que `DEC-252` vino a impedir.
    - name: Finance
      collectors:
        - type: bool
          must:
            - type: directory
              value: app/Modules/Finance/.*
          must_not:
            - type: directory
              value: app/Modules/Finance/Emision/Peru/.*

    # El adaptador peruano. Es el unico que puede ver Greenter.
    - name: EmisionPeru
      collectors: [{ type: directory, value: app/Modules/Finance/Emision/Peru/.* }]
    - name: Communication
      collectors: [{ type: directory, value: app/Modules/Communication/.* }]
    - name: Intelligence
      collectors: [{ type: directory, value: app/Modules/Intelligence/.* }]
    - name: Gamification
      collectors: [{ type: directory, value: app/Modules/Gamification/.* }]

    # ------------------------------------------------------------------------
    # El framework y las librerías de terceros.
    #
    # Sin esta capa, `--fail-on-uncovered` marca cada uso de `DB::`, `View` o una
    # excepción de Symfony como «dependencia sin cubrir». No era una violación de
    # arquitectura: es que nadie le había dicho a Deptrac que esas clases existen.
    # Solo se declaraban nuestras capas, y todo lo demás quedaba fuera del mapa.
    #
    # Se declara EXPLÍCITA en vez de quitar la bandera: así la comprobación sigue
    # viva y una librería nueva que nadie haya clasificado seguirá saltando, que
    # es justo lo que esa bandera existe para detectar.
    - name: Framework
      collectors:
        - type: classLike
          value: '^(Illuminate|Symfony|Carbon|Psr|Ramsey|Doctrine|Laravel|Monolog)\\.*'

    # ------------------------------------------------------------------------
    # Greenter, en su propia capa (9.9d).
    #
    # NO entra en `Framework` a proposito. Framework aparece en todas las capas
    # --cualquiera puede usar Laravel--, y meter a Greenter ahi lo abriria a
    # todo el proyecto. En su propia capa, aparece en el `ruleset` de una sola:
    # `EmisionPeru`. Nombrarlo desde cualquier otro sitio pone Deptrac en rojo.
    #
    # Esto es `DEC-252` --«Greenter ira detras de una frontera, porque es
    # peruano y esto es para seis paises»-- convertido en una comprobacion.
    - name: Greenter
      collectors:
        - type: classLike
          value: '^Greenter\\.*'

  ruleset:
    # Framework aparece en TODAS: cualquier capa puede usar Laravel. Lo que la
    # regla sigue impidiendo es que un módulo importe a otro que no le toca.
    Framework: ~
    Shared:        [Framework]
    Core:          [Framework, Shared]
    Identity:      [Framework, Shared, Core]
    Creator:       [Framework, Shared, Core, Identity]
    Crm:           [Framework, Shared, Core, Identity]
    Client:        [Framework, Shared, Core, Identity]
    Campaign:      [Framework, Shared, Core, Identity, Creator, Client]
    Matching:      [Framework, Shared, Core, Creator, Campaign]
    Content:       [Framework, Shared, Core, Identity, Creator, Campaign]
    Measurement:   [Framework, Shared, Core, Campaign, Content]
    # 9.9d: `EmisionPeru` entra aqui SOLO para que el proveedor pueda registrar
    # el adaptador. Es una arista y esta escrita; lo que la frontera protege no
    # es que Finance ignore que existe Peru --lo tiene que saber para elegirlo--
    # sino que NADIE fuera de esa carpeta nombre a Greenter.
    Finance:       [Framework, Shared, Core, Identity, Creator, Client, Campaign, Content, EmisionPeru]

    # El adaptador peruano ve Greenter, y Finance para los datos que recibe. No
    # ve ningun otro modulo: armar un XML no necesita saber de campanas.
    EmisionPeru:   [Framework, Shared, Finance, Greenter]
    # Communication NO conoce el negocio: los datos llegan en el payload del evento.
    Communication: [Framework, Shared, Core, Identity]
    # Consumidores puros. Nadie los lista como dependencia permitida.
    Intelligence:  [Framework, Shared, Core, Creator, Campaign, Content, Measurement]
    Gamification:  [Framework, Shared, Core, Creator, Campaign, Content, Measurement]
